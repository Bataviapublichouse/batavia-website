      label: Open on this day
      type: boolean
    - name: from
      label: Opens at (for example 17:00)
      type: string
    - name: until
      label: Closes at (for example 01:00, after midnight is fine)
      type: string
  - name: saturday
    label: Saturday
    type: object
    fields:
    - name: open
      label: Open on this day
      type: boolean
    - name: from
      label: Opens at (for example 17:00)
      type: string
    - name: until
      label: Closes at (for example 01:00, after midnight is fine)
      type: string
  - name: sunday
    label: Sunday
    type: object
    fields:
    - name: open
      label: Open on this day
      type: boolean
    - name: from
      label: Opens at (for example 17:00)
      type: string
    - name: until
      label: Closes at (for example 01:00, after midnight is fine)
      type: string
- name: menus
  label: Menus (PDF)
  type: file
  path: content/menus.json
  format: json
  fields:
  - name: menus
    label: Menus
    type: object
    list: true
    fields:
    - name: name
      label: Name of the menu
      type: object
      fields:
      - name: nl
        label: Nederlands
        type: string
      - name: en
        label: English
        type: string
      - name: fy
        label: Frysk
        type: string
      - name: fr
        label: Français
        type: string
      - name: de
        label: Deutsch
        type: string
    - name: pdf
      label: PDF file (leave empty if not ready yet)
      type: file
      options:
        media: menus
        extensions:
        - pdf
