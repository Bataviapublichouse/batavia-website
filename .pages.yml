media:
- name: photos
  label: Photos
  input: media/fotos
  output: /media/fotos
  categories:
  - image
- name: menus
  label: Menu PDFs
  input: media/menus
  output: /media/menus
  categories:
  - document
content:
- name: opening_hours
  label: Opening hours
  type: file
  path: content/opening-hours.json
  format: json
  fields:
  - name: preopening
    label: 'Not open yet: show the announcement instead of the times'
    type: boolean
  - name: announcement
    label: Announcement (shown while not open yet)
    type: object
    fields:
    - name: nl
      label: Nederlands
      type: string
    - name: en
      label: English
      type: string
    - name: fy
      label: Frysk
      type: string
    - name: fr
      label: Français
      type: string
    - name: de
      label: Deutsch
      type: string
  - name: tba
    label: Text shown for each day while not open yet
    type: object
    fields:
    - name: nl
      label: Nederlands
      type: string
    - name: en
      label: English
      type: string
    - name: fy
      label: Frysk
      type: string
    - name: fr
      label: Français
      type: string
    - name: de
      label: Deutsch
      type: string
  - name: monday
    label: Monday
    type: object
    fields:
    - name: open
      label: Open on this day
      type: boolean
    - name: from
      label: Opens at (for example 17:00)
      type: string
    - name: until
      label: Closes at (for example 01:00, after midnight is fine)
      type: string
  - name: tuesday
    label: Tuesday
    type: object
    fields:
    - name: open
      label: Open on this day
      type: boolean
    - name: from
      label: Opens at (for example 17:00)
      type: string
    - name: until
      label: Closes at (for example 01:00, after midnight is fine)
      type: string
  - name: wednesday
    label: Wednesday
    type: object
    fields:
    - name: open
      label: Open on this day
      type: boolean
    - name: from
      label: Opens at (for example 17:00)
      type: string
    - name: until
      label: Closes at (for example 01:00, after midnight is fine)
      type: string
  - name: thursday
    label: Thursday
    type: object
    fields:
    - name: open
      label: Open on this day
      type: boolean
    - name: from
      label: Opens at (for example 17:00)
      type: string
    - name: until
      label: Closes at (for example 01:00, after midnight is fine)
      type: string
  - name: friday
    label: Friday
    type: object
    fields:
